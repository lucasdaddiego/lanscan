name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag past `v7`, so pin the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # Pinned so a new ruff release can't turn CI red without a deliberate bump.
      - run: uvx ruff@0.16.10 check .
      # mypy comes from the locked dev group, so its version moves with uv.lock.
      - run: uv sync --locked --group dev --python 3.14
      - run: uv run mypy

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.14 only; macOS is the real platform, Linux is the fast check.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # --locked: fail if uv.lock is stale rather than re-resolving, so CI
      # tests exactly the pinned dependency set a `make install` gets.
      - name: Install package + test deps (uv.lock)
        run: uv sync --locked --group dev --python 3.14

      # The 100% line+branch gate lives in pyproject ([tool.coverage.report]
      # fail_under = 100), so a coverage regression fails this step.
      - name: Run tests with coverage gate
        run: .venv/bin/pytest --cov=lanscan --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore
